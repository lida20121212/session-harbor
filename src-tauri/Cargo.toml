[package]
name = "session-harbor"
version = "0.1.0"
edition = "2021"

[lib]
name = "session_harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "session-harbor"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build"]
# Embed frontendDist for direct Cargo builds too. Tauri CLI removes this
# default feature in development and enables tauri/custom-protocol for builds.
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
tauri = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
