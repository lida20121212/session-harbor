name: "问题报告"
description: "报告文档问题或未来版本的可复现缺陷"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "当前仅为立项仓库，没有可运行应用。请勿提交令牌、Cookie、密码、认证链接、完整私密对话或未脱敏日志。安全问题请先阅读 SECURITY.md。"
  - type: input
    id: environment
    attributes:
      label: "环境与版本"
      description: "操作系统、Claude Desktop 版本，以及项目版本或提交；文档问题可填写不适用。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "最小复现步骤"
      description: "使用无秘密的测试内容，并注明发生在 Desktop Code、CLI 还是文档中。"
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: "预期与实际结果"
      description: "区分可观察事实与推测；未执行的测试请写 NOT RUN。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "脱敏证据（可选）"
      description: "只提供最小必要证据；账号用 A/B 代号，隐藏真实路径和私人对话。"
  - type: checkboxes
    id: privacy
    attributes:
      label: "隐私检查"
      options:
        - label: "我已移除秘密与个人敏感信息。"
          required: true
