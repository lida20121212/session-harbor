name: "需求建议"
description: "提出问题、使用场景或产品范围建议"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "当前聚焦 Windows 上 Claude Desktop Code 的本人多账号与原会话接续。请先阅读 PRD；不要提交秘密或完整私密对话。"
  - type: textarea
    id: problem
    attributes:
      label: "希望解决的问题"
      description: "说明用户场景与当前阻碍。"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "期望结果与验收方式"
      description: "说明怎样证明问题被解决；Desktop 与 CLI 的证据应分别记录。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案与约束（可选）"
      description: "可附官方资料来源；请区分已验证能力与假设。"
